[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flux-microcaps"
version = "0.1.0"
description = "Order flow and liquidity states in US micro and nano caps"
requires-python = ">=3.10"
dependencies = [
    "certifi==2025.1.31",
    "databento-dbn==0.63.0",
    "zstandard==0.25.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3"]

[tool.setuptools]
packages = []
